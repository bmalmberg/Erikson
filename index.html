*{box-sizing:border-box}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%; margin:0; background:var(--water); color:var(--ink); font-family:var(--serif); overflow:hidden}
.app{height:100%; display:grid; grid-template-rows:auto minmax(0,1fr) auto auto; grid-template-columns:minmax(0,1fr)}
header{background:var(--paper); border-bottom:1px solid var(--line); padding:10px 14px 10px; display:flex; gap:12px; align-items:center; flex-wrap:wrap}
h1{min-width:0; font-size:1.05rem; line-height:1.25; margin:0; font-weight:700; flex:1 1 220px}
h1 small{display:block; font-weight:400; font-style:italic; font-size:.85rem; color:var(--ink-soft)}
.search{flex:1 1 200px; max-width:320px; position:relative}
.search input{width:100%; font:inherit; font-size:16px; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--land); color:var(--ink)}
.search input:focus-visible{outline:2px solid var(--g-stal); outline-offset:1px}
.mapwrap{position:relative; overflow:hidden; min-height:0}
svg{display:block; width:100%; height:100%; touch-action:none; cursor:grab}
svg:active{cursor:grabbing}
.land{fill:var(--land); stroke:var(--land-edge); stroke-width:.6; vector-effect:non-scaling-stroke}
.country{fill:none; stroke:var(--border); stroke-width:.8; stroke-dasharray:3 3; vector-effect:non-scaling-stroke}
.cityriver{fill:none; stroke:var(--water); stroke-linejoin:round; stroke-linecap:round}
.citybank{fill:none; stroke:var(--river); stroke-linejoin:round; stroke-linecap:round}
.lake{fill:var(--water); stroke:var(--river); stroke-width:.4; vector-effect:non-scaling-stroke}
.river{fill:none; stroke:var(--river); stroke-width:.7; opacity:.75; vector-effect:non-scaling-stroke; stroke-linecap:round}
.river.major{stroke-width:1.5; opacity:1}
.river.dn{stroke-width:2.6}
.rlabel{font-family:var(--serif); font-style:italic; fill:var(--river); paint-order:stroke; stroke:var(--halo); stroke-width:3px; stroke-linejoin:round; pointer-events:none}
.region{font-family:var(--narrow); fill:var(--ink-soft); opacity:.55; letter-spacing:.18em; pointer-events:none}
.region.sea{font-family:var(--serif); font-style:italic; letter-spacing:.08em; fill:var(--river); opacity:.8}
.pt{cursor:pointer}
.pt circle.dot{stroke:var(--paper); }
.pt.unc circle.dot{fill:var(--paper)!important; stroke-dasharray:2 1.5}
.pt.sel circle.ring{display:block}
.pt circle.ring{display:none; fill:none; stroke:var(--ink)}
.plabel{font-family:var(--narrow); fill:var(--ink); paint-order:stroke; stroke:var(--halo); stroke-linejoin:round; pointer-events:none}
.plabel.t1{font-weight:700}
.hidden{display:none}
.controls{position:absolute; right:10px; top:10px; display:flex; flex-direction:column; gap:0; border-radius:8px; box-shadow:0 2px 10px rgba(0,0,0,.18); overflow:hidden; z-index:4}
.controls button{border-radius:0!important; border-width:0 0 1px 0!important; width:44px; height:44px!important; font-size:1.35rem!important}
.controls button:last-child{border-bottom:0!important}
.scalebar{position:absolute; right:12px; bottom:12px; z-index:3; background:color-mix(in srgb, var(--paper) 85%, transparent); border:1px solid var(--line); border-radius:6px; padding:5px 8px 4px; font-family:var(--narrow); font-size:.8rem; color:var(--ink); pointer-events:none}
.sb{display:flex; align-items:center; gap:6px; line-height:1.1}
.sb .bar{display:inline-block; height:6px; border:1.5px solid var(--ink); border-top:0}
.sb.mi .bar{border-top:1.5px solid var(--ink); border-bottom:0; height:6px}
@media (max-width:859px){ .scalebar{right:auto; left:10px; bottom:auto; top:10px} }
.tline{display:flex; gap:6px; overflow-x:auto; padding:7px 10px; background:var(--paper); border-top:1px solid var(--line); scrollbar-width:thin; scroll-behavior:smooth}
.tline .tsec{flex:0 0 auto; align-self:center; font-family:var(--narrow); font-weight:700; font-size:.82rem; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); padding:0 4px 0 10px; border-left:2px solid var(--line)}
.tline .tsec:first-child{border-left:0; padding-left:2px}
.tline button{flex:0 0 auto; max-width:190px; text-align:left; font:inherit; font-size:.85rem; line-height:1.2; border:1px solid var(--line); background:var(--land); color:var(--ink); border-radius:6px; padding:5px 9px; cursor:pointer}
.tline button small{display:block; font-family:var(--narrow); font-size:.78rem; color:var(--ink-soft)}
.tline button span{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tline button[aria-current="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.tline button[aria-current="true"] small{color:var(--paper); opacity:.8}
.tline button.prevbtn{border-color:var(--ink-soft); border-style:dashed}
.tline button:focus-visible{outline:2px solid var(--su); outline-offset:1px}
.plabel.evl{font-weight:700}
.pt.dim{opacity:.75}
.plabel.diml{fill:var(--ink-soft)}
.controls button,.listbtn{font:inherit; font-family:var(--narrow); font-size:1rem; min-width:40px; height:40px; border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:6px; cursor:pointer}
.controls button:focus-visible,.chip:focus-visible,.listbtn:focus-visible,.item:focus-visible{outline:2px solid var(--g-stal); outline-offset:2px}
footer{background:var(--paper); border-top:1px solid var(--line); padding:8px 10px; display:flex; gap:8px; align-items:center}
.chips{min-width:0; display:flex; gap:6px; overflow-x:auto; flex:1; scrollbar-width:none; padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto; font-family:var(--narrow); font-size:.95rem; border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:999px; padding:6px 11px 6px 9px; display:flex; align-items:center; gap:6px; cursor:pointer}
.chip i{width:10px; height:10px; border-radius:50%; display:inline-block}
.chip[aria-pressed="false"]{opacity:.45; text-decoration:line-through}
.listbtn{padding:0 12px; flex:0 0 auto}
.panel{position:absolute; left:0; right:0; bottom:0; max-height:42%; background:var(--paper); border-top:1px solid var(--line); box-shadow:0 -6px 24px rgba(0,0,0,.18); transform:translateY(105%); transition:transform .22s ease; display:flex; flex-direction:column; z-index:5}
.panel.open{transform:none}
@media (prefers-reduced-motion: reduce){.panel{transition:none}}
.phead{display:flex; align-items:center; justify-content:space-between; padding:10px 14px 6px; gap:10px}
.phead h2{margin:0; font-size:1.05rem}
.close{font:inherit; font-size:1.3rem; line-height:1; width:36px; height:36px; border:0; background:transparent; color:var(--ink); cursor:pointer; border-radius:6px}
.pbody{overflow-y:auto; padding:0 14px 14px; -webkit-overflow-scrolling:touch}
.detail .name{font-size:1.35rem; font-weight:700; margin:2px 0 2px}
.detail .modern{font-style:italic; color:var(--ink-soft); margin:0 0 10px}
.detail dl{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; margin:0; font-size:.95rem; line-height:1.45}
.detail dt{font-family:var(--narrow); color:var(--ink-soft)}
.detail dd{margin:0}
.list h3{font-family:var(--narrow); font-weight:700; font-size:1rem; margin:14px 0 4px; display:flex; align-items:center; gap:7px}
.list h3 i{width:10px; height:10px; border-radius:50%}
.list ul{list-style:none; margin:0; padding:0; columns:2 150px; column-gap:16px}
.item{font:inherit; font-size:.95rem; text-align:left; background:none; border:0; color:var(--ink); padding:3px 0; cursor:pointer; width:100%}
.item .q{color:var(--ink-soft); font-size:.8rem}
.note{font-size:.88rem; color:var(--ink-soft); line-height:1.5; max-width:70ch}
.legendline{display:flex; gap:14px; flex-wrap:wrap; font-family:var(--narrow); font-size:.9rem; color:var(--ink-soft); margin:6px 0 2px}
.legendline span{display:inline-flex; align-items:center; gap:6px}
.sw{width:11px;height:11px;border-radius:50%;display:inline-block;background:var(--ink-soft)}
.sw.h{background:var(--paper); border:1.5px dashed var(--ink-soft)}
.pt.prev{opacity:.45}
.plabel.prevl{opacity:.45}
.ov .prevev{opacity:.32}
.ov path.arr{fill:none; stroke-width:3.2; stroke-linecap:round}
.ov path.arr.de{stroke:var(--de)} .ov path.arr.su{stroke:var(--su)}
.ov path.arr.plan{stroke-dasharray:7 5}
.ov path.head.de{fill:var(--de)} .ov path.head.su{fill:var(--su)}
.ov path.front.de{stroke:var(--de)}
.ov text.de{fill:var(--de)}
.ov path.front{fill:none; stroke:var(--su); stroke-width:4; stroke-linejoin:round; opacity:.85}
.ov text{font-family:var(--narrow); font-size:12px; fill:var(--su); paint-order:stroke; stroke:var(--halo); stroke-width:3px}
.ev .date{font-style:italic; color:var(--ink-soft); margin:2px 0 0}
.ev .title{font-size:1.3rem; font-weight:700; margin:2px 0 8px; line-height:1.25}
.ev p.body{line-height:1.55; margin:0 0 12px; max-width:62ch}
.river.canal{stroke-dasharray:4 2}
.unit{cursor:pointer}
.unit .uhit{fill:transparent}
.unit .ubox{stroke:var(--paper); stroke-width:1.2}
.unit.su .ubox{fill:var(--su)} .unit.de .ubox{fill:var(--de)}
.unit .usym{fill:none; stroke:var(--paper); stroke-width:1.3}
.unit .usz{font-family:var(--narrow); font-size:8px; font-weight:700; letter-spacing:-.5px; paint-order:stroke; stroke:var(--halo); stroke-width:2.5px}
.unit.su .usz{fill:var(--su)} .unit.de .usz{fill:var(--de)}
.unit .uhq{font-family:var(--narrow); font-size:9px; font-weight:700; fill:var(--paper); stroke:none}
.unit:focus-visible{outline:none} .unit:focus-visible .ubox{stroke:var(--ink); stroke-width:2.5}
.upop{position:absolute; z-index:6; max-width:250px; background:var(--paper); color:var(--ink); border:1px solid var(--line); border-radius:8px; box-shadow:0 6px 20px rgba(0,0,0,.22); padding:10px 34px 10px 12px; font-size:.92rem; line-height:1.4}

.upop .pside{font-family:var(--narrow); font-size:.85rem; color:var(--ink-soft)}
.upop .pside.su{color:var(--su)}
.upop .pname{font-weight:700; font-size:1.05rem; margin:2px 0}
.upop .pcmd{font-style:italic}
.upop .pnote{margin-top:4px; color:var(--ink)}
.tabs{display:flex; gap:0; margin:2px 0 8px; border:1px solid var(--line); border-radius:6px; overflow:hidden}
.tabs button{flex:1; font:inherit; font-family:var(--narrow); font-size:.95rem; padding:8px 4px; line-height:1.15; border:0; background:transparent; color:var(--ink-soft); cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink); color:var(--paper)}
.tabs button:focus-visible{outline:2px solid var(--g-stal); outline-offset:-2px}
.evnav{display:flex; align-items:center; gap:8px; margin:6px 0 10px}
.evnav button{font:inherit; font-family:var(--narrow); font-size:1rem; height:38px; padding:0 14px; border:1px solid var(--line); background:var(--land); color:var(--ink); border-radius:6px; cursor:pointer}
.evnav button:disabled{opacity:.4; cursor:default}
.evnav span{font-family:var(--narrow); color:var(--ink-soft); flex:1; text-align:center}
.evkey{display:flex; gap:14px; flex-wrap:wrap; font-family:var(--narrow); font-size:.9rem; color:var(--ink-soft); margin:0 0 6px}
.evkey span{display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
.evkey b{display:inline-block; width:22px; height:3px; border-radius:2px}
.evlist{list-style:none; padding:0; margin:6px 0 0; border-top:1px solid var(--line)}
.evlist button{font:inherit; font-size:.92rem; text-align:left; width:100%; background:none; border:0; border-bottom:1px solid var(--line); color:var(--ink); padding:7px 0; cursor:pointer; display:flex; gap:10px}
.evlist button em{color:var(--ink-soft); flex:0 0 7.5em; font-family:var(--narrow); font-style:normal}
.evlist button[aria-current="true"]{font-weight:700}
@media (max-width:600px){ h1 small{display:none} header{padding:8px 12px} .search input{padding:6px 10px} }
@media (min-width:860px){
  .panel{left:auto; right:auto; top:0; bottom:0; width:360px; max-height:none; border-top:0; border-right:1px solid var(--line); transform:translateX(-105%); box-shadow:6px 0 24px rgba(0,0,0,.15)}
  .panel.open{transform:none}
}

{d:"24 September–14 November", t:"The Bukrin airborne drop",
 x:"To widen the Bukrin bridgehead the Stavka threw in three airborne brigades. On the night of 26 September too few transports, too little fuel and German flak scattered the drop: 3rd Brigade's 4,575 men landed without their guns, 5th Brigade got only two battalions down, and radio sets were separated from batteries. The paratroopers fell into a hornet's nest of three German divisions, a fact Vatutin's HQ knew but never passed on. About 600 men gathered under Colonel Sidorchuk near Kanev; his group grew to 1,000, slipped to the Cherkassy woods and finally linked up with 52nd Army on 14 November.",

function drawEv(ev, g){
  const P = (lon,lat)=>T.apply(proj([lon,lat]));
  if(ev.line){
    const pts2 = ev.line.map(c=>P(c[0],c[1]));
    g.append('path').attr('class','front'+(ev.lineSide==='de'?' de':'')).attr('d',d3.line().curve(d3.curveCatmullRom)(pts2));
    const m = pts2[pts2.length-1];
    g.append('text').attr('class',ev.lineSide==='de'?'de':'').attr('x',m[0]).attr('y',m[1]+20).attr('text-anchor','end').text(ev.lineLabel||'');
  }
  for(const a of ev.a){
    const p0=P(a[0],a[1]), p1=P(a[2],a[3]);
    const dx=p1[0]-p0[0], dy=p1[1]-p0[1], L=Math.hypot(dx,dy); if(L<6) continue;
    const nx=-dy/L, ny=dx/L, bend=L*0.12;
    const c=[(p0[0]+p1[0])/2+nx*bend,(p0[1]+p1[1])/2+ny*bend];
    const hl=Math.min(14,L*0.35);
    const tx=p1[0]-c[0], ty=p1[1]-c[1], tl=Math.hypot(tx,ty), ux=tx/tl, uy=ty/tl;
    const end=[p1[0]-ux*hl*0.6, p1[1]-uy*hl*0.6];
    g.append('path').attr('class','arr '+a[4]+(a[5]?' plan':'')).attr('d',`M${p0}Q${c} ${end}`);
    const b=[p1[0]-ux*hl, p1[1]-uy*hl];
    g.append('path').attr('class','head '+a[4]).attr('d',`M${p1}L${b[0]-uy*hl*0.5},${b[1]+ux*hl*0.5}L${b[0]+uy*hl*0.5},${b[1]-ux*hl*0.5}Z`);
  }
  for(const u of (ev.u||[])) drawUnit(g, u, P(u[3],u[4]));
}
const SIZE_MARK = {F:'XXXXX', A:'XXXX', C:'XXX', D:'XX', B:'X', G:''};

function drawUnit(g, u, p){

  s.append('rect').attr('class','ubox').attr('x',-w/2).attr('y',-h/2).attr('width',w).attr('height',h).attr('rx',1.5)
    .attr('stroke-dasharray', size==='G'?'3 2':null);
  const L = (x1,y1,x2,y2)=>s.append('line').attr('class','usym').attr('x1',x1).attr('y1',y1).attr('x2',x2).attr('y2',y2);
  if(type==='inf'||type==='mot'||type==='abn'){ L(-w/2,-h/2,w/2,h/2); L(-w/2,h/2,w/2,-h/2); }
  if(type==='abn') s.append('path').attr('class','usym').attr('d','M-6,5.5Q-3,2 0,5.5Q3,2 6,5.5');
  if(type==='cav') L(-w/2,h/2,w/2,-h/2);

const byName = Object.fromEntries(pts.map(p=>[p.n,p]));
function evPoints(ev){
  const xy = ev.p.map(n=>[byName[n].x,byName[n].y]);
  ev.a.forEach(a=>{xy.push(proj([a[0],a[1]]),proj([a[2],a[3]]));});
  (ev.line||[]).forEach(c=>xy.push(proj(c)));
  (ev.u||[]).forEach(u=>xy.push(proj([u[3],u[4]])));
  return xy;
}
function box(xy){const xs=xy.map(p=>p[0]), ys=xy.map(p=>p[1]); return [Math.min(...xs),Math.max(...xs),Math.min(...ys),Math.max(...ys)];}
function fitEvent(ev, pev){
  let [x0,x1,y0,y1] = box(evPoints(ev));
  if(pev){
    const [a0,a1,b0,b1] = box(evPoints(ev).concat(evPoints(pev)));
    const s = Math.max(x1-x0, y1-y0, 1);
    // include the previous event only if it doesn't force a much wider view
    if(Math.max(a1-a0, b1-b0) <= 2.2*s){ x0=a0; x1=a1; y0=b0; y1=b1; }
  }
  const narrow = matchMedia('(max-width:859px)').matches;
  const ph = narrow ? panel.getBoundingClientRect().height : 0;
  const vw = narrow? W : W-360, vh = narrow? Math.max(160, H-ph-8) : H, ox = narrow?0:360;
  const k = Math.min(160, 0.8*Math.min(vw/Math.max(x1-x0,1), vh/Math.max(y1-y0,1)));
  const tr = d3.zoomIdentity.translate(ox+vw/2, (narrow? vh/2+4 : H/2)).scale(k).translate(-(x0+x1)/2,-(y0+y1)/2);
  svg.transition().duration(matchMedia('(prefers-reduced-motion: reduce)').matches?0:700).call(zoom.transform, tr);
}
function showEvent(i){
  hidePop(); curEv=i; const ev=EVENTS[i]; evSet=new Set(ev.p); selected=null; panelMode='event';
  ptitle.textContent='Events of 1943';
  const ser = EVENTS.map((e,j)=>j).filter(j=>EVENTS[j].s===ev.s), pos = ser.indexOf(i);
  prevEv = pos>0 ? ser[pos-1] : -1; prevSet = prevEv>=0 ? new Set(EVENTS[prevEv].p) : null;
  const hasSu = ev.a.some(a=>a[4]==='su')||ev.line, hasDe = ev.a.some(a=>a[4]==='de'), hasPlan = ev.a.some(a=>a[5]);
  pbody.innerHTML = `<div class="ev">
    <div class="tabs" role="tablist">${Object.entries(SERIES).map(([k,v])=>`<button role="tab" data-s="${k}" aria-selected="${+k===ev.s}">${esc(v)}</button>`).join('')}</div>
    <div class="evnav"><button id="evprev" ${pos===0?'disabled':''}>Previous</button><span>${pos+1} of ${ser.length}</span><button id="evnext" ${pos===ser.length-1?'disabled':''}>Next</button></div>
    <p class="date">${esc(ev.d)} 1943</p><p class="title">${esc(ev.t)}</p>
    <div class="evkey">${hasDe?'<span><b style="background:var(--de)"></b>German</span>':''}${hasSu?'<span><b style="background:var(--g-stal)"></b>Soviet</span>':''}${(ev.u||[]).length?'<span><svg width="18" height="11" aria-hidden="true"><rect x="1" y="1" width="16" height="9" fill="var(--su)"/></svg>Soviet unit</span>'+(ev.u.some(u=>u[0]==='de')?'<span><svg width="18" height="11" aria-hidden="true"><rect x="1" y="1" width="16" height="9" fill="var(--de)"/></svg>German unit</span>':''):''}${prevEv>=0?'<span>Faded: previous event</span>':''}${hasPlan?'<span>Dashed: '+(ev.dashNote||(ev.s===1?'planned, from the captured papers':'planned or intended moves'))+'</span>':''}</div>
    <p class="body">${esc(ev.x)}</p>
    <ul class="evlist">${ser.map(j=>`<li><button data-j="${j}" aria-current="${j===i}"><em>${esc(EVENTS[j].d)}</em>${esc(EVENTS[j].t)}</button></li>`).join('')}</ul>
    <p class="note">Tap a unit symbol for its name and commander. Arrows, lines and unit positions are approximate, drawn from the book's descriptions.</p></div>`;
  pbody.scrollTop=0;
  document.getElementById('evprev').onclick=()=>showEvent(ser[pos-1]);
  document.getElementById('evnext').onclick=()=>showEvent(ser[pos+1]);
  pbody.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ const s=+b.dataset.s; if(s!==ev.s) showEvent(EVENTS.findIndex(e=>e.s===s)); });
  pbody.querySelectorAll('.evlist button').forEach(b=>b.onclick=()=>showEvent(+b.dataset.j));
  openPanel(); render(); markTline(); fitEvent(ev, prevEv>=0?EVENTS[prevEv]:null);
}
function clearEvent(){ curEv=-1; evSet=null; prevEv=-1; prevSet=null; if(typeof markTline==='function') markTline(); }
document.getElementById('evbtn').onclick=()=> panelMode==='event'?closePanel():showEvent(curEv<0?0:curEv);

// distance bar
function niceLen(x){ const p=Math.pow(10,Math.floor(Math.log10(x))); const f=x/p; return (f>=5?5:f>=2?2:1)*p; }
function updateScale(){
  if(!W) return;
  const cx=W/2, cy=H/2, a=proj.invert(T.invert([cx-50,cy])), b=proj.invert(T.invert([cx+50,cy]));
  if(!a||!b) return;
  const kmPer100 = d3.geoDistance(a,b)*6371, pxPerKm = 100/kmPer100;
  const km=niceLen(110/pxPerKm), mi=niceLen(110/(pxPerKm*1.609344));
  const s=document.getElementById('scale');
  s.querySelector('.km .bar').style.width=(km*pxPerKm)+'px'; s.querySelector('.km .lab').textContent=km+' km';
  s.querySelector('.mi .bar').style.width=(mi*1.609344*pxPerKm)+'px'; s.querySelector('.mi .lab').textContent=mi+' miles';
}
// event bar
const tline=document.getElementById('tline');
(function buildTline(){
  let html='';
  for(const [s,name] of Object.entries(SERIES)){
    html+=`<span class="tsec">${esc(name)}</span>`;
    EVENTS.forEach((e,j)=>{ if(e.s===+s) html+=`<button data-j="${j}" title="${esc(e.d)}: ${esc(e.t)}"><small>${esc(e.d)}</small><span>${esc(e.t)}</span></button>`; });
  }
  tline.innerHTML=html;
  tline.querySelectorAll('button').forEach(b=>b.onclick=()=>showEvent(+b.dataset.j));
})();
function markTline(){
  tline.querySelectorAll('button').forEach(b=>{ const j=+b.dataset.j; b.setAttribute('aria-current', j===curEv); b.classList.toggle('prevbtn', j===prevEv); });
  const cur=tline.querySelector('button[aria-current="true"]');
  if(cur){ const target=cur.offsetLeft - (tline.clientWidth-cur.offsetWidth)/2; tline.scrollTo({left:Math.max(0,target)}); }
}
document.getElementById('zevent').onclick=()=>{ if(curEv>=0) fitEvent(EVENTS[curEv], prevEv>=0?EVENTS[prevEv]:null); else svg.transition().duration(400).call(zoom.transform,d3.zoomIdentity); };

// chips
const chips=document.getElementById('chips');
for(const g of Object.keys(GROUPS)){
  const b=document.createElement('button'); b.className='chip'; b.setAttribute('aria-pressed','true');
  b.innerHTML=`<i style="background:${col(g)}"></i>${GROUPS[g].name}`;
  b.onclick=()=>{visible[g]=!visible[g]; b.setAttribute('aria-pressed',visible[g]); render();};
  chips.appendChild(b);
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{chips.querySelectorAll('i').forEach((i,n)=>i.style.background=col(Object.keys(GROUPS)[n])); render();});

// open on the first event
requestAnimationFrame(()=>showEvent(0));

window.addEventListener('resize',()=>{
  fit(); drawBase(); pts.forEach(p=>{const xy=proj([p.lo,p.la]); p.x=xy[0]; p.y=xy[1];}); render();
});
</script>
<script data-goatcounter="https://bmalmberg.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
